# =============================================================
# application-test.yml — Perfil de Testes (CI / unitários)
# Desabilita banco e Flyway para smoke tests sem infraestrutura.
# =============================================================

spring:
  flyway:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: none

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

logging:
  level:
    root: WARN
