# =============================================================
# application.yml — Configuração Base (compartilhada por todos os perfis)
# Projeto: Gestão de Obras API
# =============================================================

spring:
  application:
    name: gestao-obras-api

  # Perfil ativo padrão. Sobrescreva via -Dspring.profiles.active=prod
  # ou pela variável de ambiente SPRING_PROFILES_ACTIVE=prod.
  profiles:
    active: dev

  # -----------------------------------------------------------
  # Datasource — PostgreSQL
  # Valores lidos de variáveis de ambiente.
  # Os defaults (após ':') servem exclusivamente para dev local.
  # Nunca defina credenciais reais neste arquivo versionado.
  # -----------------------------------------------------------
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gestao_obras}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000   # ms — tempo máximo aguardando conexão do pool
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000        # ms
      max-lifetime: 1800000       # ms

  # -----------------------------------------------------------
  # JPA / Hibernate
  #
  # ddl-auto=validate: Hibernate APENAS valida o schema contra
  # as entidades mapeadas. NÃO cria, NÃO altera tabelas.
  # O Flyway é a única fonte da verdade do schema do banco.
  # -----------------------------------------------------------
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false           # Evita lazy-loading fora da transação (anti-padrão)
    show-sql: false               # Sobrescrito por perfil (dev = true)
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC          # Todos os timestamps persistidos em UTC
        default_schema: public

  # -----------------------------------------------------------
  # Flyway — Versionamento de Schema
  # -----------------------------------------------------------
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false    # false → banco deve estar limpo na 1ª execução
    validate-on-migrate: true     # Valida checksums antes de aplicar migrations
    out-of-order: false           # Aplica migrations estritamente em ordem crescente

  # -----------------------------------------------------------
  # Serialização JSON — Jackson
  # -----------------------------------------------------------
  jackson:
    date-format: yyyy-MM-dd
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null
    time-zone: UTC

# -----------------------------------------------------------
# Servidor HTTP
# -----------------------------------------------------------
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  error:
    include-message: always
    include-binding-errors: always

# -----------------------------------------------------------
# Logging — nível base; sobrescrito por perfil
# -----------------------------------------------------------
logging:
  level:
    root: INFO
    org.flywaydb: INFO
