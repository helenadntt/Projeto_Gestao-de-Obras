# =============================================================
# application-dev.yml — Perfil de Desenvolvimento Local
# Ativado por padrão via spring.profiles.active=dev em application.yml
# =============================================================

spring:
  jpa:
    # Exibe o SQL gerado pelo Hibernate — útil para depuração local
    show-sql: true

# -----------------------------------------------------------
# Logging detalhado para desenvolvimento
# -----------------------------------------------------------
logging:
  level:
    root: INFO
    br.com.gestaoobras: DEBUG          # Logs do próprio código da aplicação
    org.springframework.web: DEBUG     # Logs do dispatcher / controllers
    org.hibernate.SQL: DEBUG           # SQL gerado (em conjunto com show-sql)
    org.hibernate.orm.jdbc.bind: TRACE # Valores dos parâmetros bind (SQL completo)
    org.flywaydb: DEBUG                # Logs detalhados do Flyway
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
