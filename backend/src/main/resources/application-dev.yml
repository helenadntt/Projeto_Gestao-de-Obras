# =============================================================
# application-dev.yml — Perfil de Desenvolvimento Local
# =============================================================

spring:
  jpa:
    show-sql: true

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    br.com.gestaoobras: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.flywaydb: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
